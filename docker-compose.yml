services:
  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URI: postgresql://postgres:devpassword@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:3001
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
